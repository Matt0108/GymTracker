<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gym Tracker - Add Exercise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="exercise.html">Exercises</a>
    </nav>

    <h1>Add Exercise</h1>
    <img class="gym-image" src="images/benchxd.webp" alt="Gym equipment">

    <form>
        <label for="exerciseName">Exercise Name:</label>
        <input type="text" id="exerciseName" name="exerciseName">

        <br><br>

        <label for="weight">Weight:</label>
        <input type="number" id="weight" name="weight">

        <br><br>

        <label for="sets">Sets:</label>
        <input type="number" id="sets" name="sets">

        <br><br>

        <label for="reps">Reps:</label>
        <input type="number" id="reps" name="reps">

        <br><br>

        <input type="submit" value="Add Exercise">
    </form>

</body>
</html>
